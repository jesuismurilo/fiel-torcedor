<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {% block titulo %}
    Fiel Torcedor
    {% endblock %}
  </title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    .bg-custom-red { background-color: #d9304f !important; }
    .text-custom-red { color: #d9304f !important; }
    .btn-custom-red { background-color: #d9304f; border-color: #d9304f; color: #fff; }
    .btn-custom-red:hover, .btn-custom-red:focus { background-color: #b82541; border-color: #b82541; color: #fff; }
  </style>
</head>

<body class="bg-light text-dark">

  <div class="container d-flex flex-column align-items-center justify-content-center min-vh-100 py-4">
    <div class="w-100" style="max-width: 460px;">
      {% for tipo, mensagem in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ tipo }} alert-dismissible fade show" role="alert">
        {{ mensagem }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
      </div>
      {% endfor %}
    </div>

    {% block conteudo %}

    {% endblock %}
  </div>

  <!-- Bootstrap 5.3 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>

</html>

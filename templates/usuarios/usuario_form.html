<!-- Herda o layout base com menu, mensagens flash e rodapé -->
{% extends 'layout/base_menu.html' %}

<!-- Define o título da aba do navegador -->
{% block titulo %}Usuário{% endblock %}

<!-- Conteúdo principal da página -->
{% block conteudo %}
  <!-- Garante que 'dados' seja um dicionário vazio caso não venha preenchido -->
  {% set dados = dados or {} %}

  <!-- Título muda conforme a ação ('editar' ou 'inserir') -->
  <h1>{{ 'Editar usuário' if acao == 'editar' else 'Novo usuário' }}</h1>

  <!-- Envia o formulário para a rota de edição ou de cadastro -->
  <form
    method="post"
    action="{{ url_for('editar_usuario', id_usuario=id_usuario) if acao == 'editar' else url_for('inserir_usuario') }}"
  >
    <!-- Token de segurança contra CSRF -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <!-- Grade principal de campos -->
    <div class="row g-3">
      <!-- Nome completo -->
      <div class="col-md-6">
        <label for="nome" class="form-label">Nome</label>
        <input
          id="nome"
          type="text"
          class="form-control"
          name="nome"
          value="{{ dados.nome or '' }}"
          required
        >
      </div>

      <!-- E-mail -->
      <div class="col-md-6">
        <label for="email" class="form-label">E-mail</label>
        <input
          id="email"
          type="email"
          class="form-control"
          name="email"
          value="{{ dados.email or '' }}"
          required
        >
      </div>

      <!-- Senha: obrigatória apenas ao criar novo usuário -->
      <div class="col-md-6">
        <label for="senha" class="form-label">
          Senha {{ '(deixe em branco para manter)' if acao == 'editar' else '' }}
        </label>
        <input
          id="senha"
          type="password"
          class="form-control"
          name="senha"
          {% if acao != 'editar' %}required{% endif %}
        >
      </div>

      <!-- Confirmação de senha -->
      <div class="col-md-6">
        <label for="confirmacao" class="form-label">Confirmação</label>
        <input
          id="confirmacao"
          type="password"
          class="form-control"
          name="confirmacao"
          {% if acao != 'editar' %}required{% endif %}
        >
      </div>

      <!-- Perfil de acesso -->
      <div class="col-md-4">
        <label for="perfil_id" class="form-label">Perfil</label>
        <select id="perfil_id" class="form-select" name="perfil_id" required>
          {% for p in perfis %}
            <option
              value="{{ p.id_perfil }}"
              {% if dados.perfil_id | string == p.id_perfil | string %}selected{% endif %}
            >
              {{ p.nome }}
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- CPF -->
      <div class="col-md-4">
        <label for="cpf" class="form-label">CPF</label>
        <input
          id="cpf"
          type="text"
          class="form-control"
          name="cpf"
          value="{{ dados.cpf or '' }}"
        >
      </div>

      <!-- Celular -->
      <div class="col-md-4">
        <label for="celular" class="form-label">Celular</label>
        <input
          id="celular"
          type="text"
          class="form-control"
          name="celular"
          value="{{ dados.celular or '' }}"
        >
      </div>

      <!-- Data de nascimento -->
      <div class="col-md-4">
        <label for="data_nascimento" class="form-label">Nascimento</label>
        <input
          id="data_nascimento"
          type="date"
          class="form-control"
          name="data_nascimento"
          value="{{ dados.data_nascimento or '' }}"
        >
      </div>

      <!-- CEP -->
      <div class="col-md-4">
        <label for="cep" class="form-label">CEP</label>
        <input
          id="cep"
          type="text"
          class="form-control"
          name="cep"
          value="{{ dados.cep or '' }}"
        >
      </div>

      <!-- Estado (UF) -->
      <div class="col-md-4">
        <label for="estado" class="form-label">Estado</label>
        <select id="estado" class="form-select" name="estado">
          <option value="">—</option>
          {% for uf in ufs %}
            <option value="{{ uf }}" {% if dados.estado == uf %}selected{% endif %}>
              {{ uf }}
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- Endereço (logradouro) -->
      <div class="col-md-8">
        <label for="endereco" class="form-label">Endereço</label>
        <input
          id="endereco"
          type="text"
          class="form-control"
          name="endereco"
          value="{{ dados.endereco or '' }}"
        >
      </div>

      <!-- Número do endereço -->
      <div class="col-md-4">
        <label for="numero" class="form-label">Número</label>
        <input
          id="numero"
          type="text"
          class="form-control"
          name="numero"
          value="{{ dados.numero or '' }}"
        >
      </div>

      <!-- Complemento -->
      <div class="col-md-6">
        <label for="complemento" class="form-label">Complemento</label>
        <input
          id="complemento"
          type="text"
          class="form-control"
          name="complemento"
          value="{{ dados.complemento or '' }}"
        >
      </div>

      <!-- Cidade -->
      <div class="col-md-6">
        <label for="cidade" class="form-label">Cidade</label>
        <input
          id="cidade"
          type="text"
          class="form-control"
          name="cidade"
          value="{{ dados.cidade or '' }}"
        >
      </div>
    </div>

    <!-- Botão de envio -->
    <button type="submit" class="btn btn-success mt-3">Salvar</button>
    <a class="btn btn-light mt-3 ms-2" href="{{ url_for('listar_usuarios') }}">Cancelar</a>
  </form>
{% endblock %}
